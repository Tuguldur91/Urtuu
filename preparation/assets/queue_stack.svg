<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380"><rect width="960" height="380" rx="16" fill="#f8fafc"/><text x="28" y="42" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#183047">Choose the right rule for taking items out</text><rect x="25" y="85" width="290" height="205" rx="10" fill="#e0f2fe"/><text x="40" y="120" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">Queue: waiting line</text><text x="40" y="160" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">Arrive: A, then B, then C</text><text x="40" y="192" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">Leave: A, then B, then C</text><text x="40" y="224" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">FIFO = oldest first</text><text x="313" y="205" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#183047">→</text><rect x="335" y="85" width="290" height="205" rx="10" fill="#e0f2fe"/><text x="350" y="120" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">Stack: pile of plates</text><text x="350" y="160" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">Place: A, then B, then C</text><text x="350" y="192" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">Take: C, then B, then A</text><text x="350" y="224" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">LIFO = newest first</text><text x="623" y="205" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#183047">→</text><rect x="645" y="85" width="290" height="205" rx="10" fill="#e0f2fe"/><text x="660" y="120" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">Why it matters</text><text x="660" y="160" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">BFS uses a queue</text><text x="660" y="192" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">Undo often uses a stack</text><text x="660" y="224" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">Order changes behavior</text><text x="28" y="335" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">A data structure is a way to organize information and the operations on it.</text></svg>