<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380"><rect width="960" height="380" rx="16" fill="#f8fafc"/><text x="28" y="42" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#183047">See the timing of SOS</text><text x="30" y="85" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183047">Each small time slot is one unit. Colored blocks mean sound.</text><rect x="40" y="125" width="24" height="60" rx="10" fill="#0d9488"/><rect x="88" y="125" width="24" height="60" rx="10" fill="#0d9488"/><rect x="136" y="125" width="24" height="60" rx="10" fill="#0d9488"/><text x="40" y="110" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">S</text><rect x="232" y="125" width="72" height="60" rx="10" fill="#0d9488"/><rect x="328" y="125" width="72" height="60" rx="10" fill="#0d9488"/><rect x="424" y="125" width="72" height="60" rx="10" fill="#0d9488"/><text x="232" y="110" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">O</text><rect x="568" y="125" width="24" height="60" rx="10" fill="#0d9488"/><rect x="616" y="125" width="24" height="60" rx="10" fill="#0d9488"/><rect x="664" y="125" width="24" height="60" rx="10" fill="#0d9488"/><text x="568" y="110" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">S</text><text x="30" y="235" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#183047">Dot = 1 unit     Dash = 3 units     Within-letter gap = 1 unit</text><text x="30" y="275" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#183047">Between letters = 3 units     Between words = 7 units</text><text x="30" y="325" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">Listen for duration AND silence:  ...   ---   ...  =  SOS</text></svg>