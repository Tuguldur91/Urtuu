<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><rect width="960" height="400" rx="16" fill="#f8fafc"/><text x="28" y="42" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#183047">BFS is like ripples spreading from A</text><line x1="110" y1="160" x2="350" y2="100" stroke="#64748b" stroke-width="4"/><line x1="110" y1="160" x2="350" y2="240" stroke="#64748b" stroke-width="4"/><line x1="350" y1="100" x2="620" y2="100" stroke="#64748b" stroke-width="4"/><line x1="350" y1="240" x2="620" y2="240" stroke="#64748b" stroke-width="4"/><circle cx="110" cy="160" r="29" fill="#fde68a"/><text x="102" y="167" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#183047">A</text><circle cx="350" cy="100" r="29" fill="#bae6fd"/><text x="342" y="107" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#183047">B</text><circle cx="350" cy="240" r="29" fill="#bae6fd"/><text x="342" y="247" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#183047">C</text><circle cx="620" cy="100" r="29" fill="#bbf7d0"/><text x="612" y="107" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#183047">D</text><circle cx="620" cy="240" r="29" fill="#bbf7d0"/><text x="612" y="247" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#183047">E</text><text x="60" y="310" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183047">Layer 0: A</text><text x="280" y="310" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183047">Layer 1: B, C</text><text x="550" y="310" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183047">Layer 2: D, E</text><text x="30" y="355" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#183047">BFS explores all nodes one hop away before nodes two hops away.</text></svg>