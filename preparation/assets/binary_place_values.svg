<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380"><rect width="960" height="380" rx="16" fill="#f8fafc"/><text x="28" y="42" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#183047">Read a byte, one column at a time</text><rect x="30" y="100" width="100" height="125" rx="10" fill="#e2e8f0"/><text x="50" y="135" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">128</text><text x="68" y="190" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#183047">0</text><rect x="142" y="100" width="100" height="125" rx="10" fill="#bbf7d0"/><text x="162" y="135" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">64</text><text x="180" y="190" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#183047">1</text><rect x="254" y="100" width="100" height="125" rx="10" fill="#e2e8f0"/><text x="274" y="135" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">32</text><text x="292" y="190" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#183047">0</text><rect x="366" y="100" width="100" height="125" rx="10" fill="#e2e8f0"/><text x="386" y="135" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">16</text><text x="404" y="190" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#183047">0</text><rect x="478" y="100" width="100" height="125" rx="10" fill="#e2e8f0"/><text x="498" y="135" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">8</text><text x="516" y="190" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#183047">0</text><rect x="590" y="100" width="100" height="125" rx="10" fill="#e2e8f0"/><text x="610" y="135" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">4</text><text x="628" y="190" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#183047">0</text><rect x="702" y="100" width="100" height="125" rx="10" fill="#e2e8f0"/><text x="722" y="135" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">2</text><text x="740" y="190" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#183047">0</text><rect x="814" y="100" width="100" height="125" rx="10" fill="#bbf7d0"/><text x="834" y="135" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">1</text><text x="852" y="190" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#183047">1</text><text x="30" y="80" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183047">Place value (top) × bit (bottom): count only the green columns.</text><text x="30" y="270" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#183047">64 + 1 = 65  →  ASCII character A</text><text x="30" y="320" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183047">Same byte in hexadecimal: 41 = (4 × 16) + 1 = 65</text></svg>