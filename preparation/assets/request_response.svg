<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380"><rect width="960" height="380" rx="16" fill="#f8fafc"/><text x="28" y="42" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#183047">A browser asks; a server answers</text><rect x="25" y="85" width="290" height="205" rx="10" fill="#e0f2fe"/><text x="40" y="120" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">1. Browser (client)</text><text x="40" y="160" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">GET /rules</text><text x="40" y="192" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">“Please show the rules.”</text><text x="40" y="224" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">Request travels →</text><text x="313" y="205" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#183047">→</text><rect x="335" y="85" width="290" height="205" rx="10" fill="#e0f2fe"/><text x="350" y="120" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">2. Server</text><text x="350" y="160" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">Looks for /rules</text><text x="350" y="192" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">Checks access</text><text x="350" y="224" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">Builds a response</text><text x="623" y="205" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#183047">→</text><rect x="645" y="85" width="290" height="205" rx="10" fill="#e0f2fe"/><text x="660" y="120" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#183047">3. Browser receives</text><text x="660" y="160" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">200: page returned</text><text x="660" y="192" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">403: access refused</text><text x="660" y="224" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">404: page not found</text><text x="28" y="335" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183047">A local server can answer over the room network without internet access.</text></svg>